
name: Build Status Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q status-pro-mvp-0.1.0.zip -d extracted

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: |
          cd extracted/status-pro
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: status-pro-apk
          path: extracted/status-pro/app/build/outputs/apk/debug/app-debug.apk
